<form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-6">
  <!-- Email -->
  <div>
    <label class="block text-sm font-medium leading-6 text-gray-900">Email</label>
    <input 
      formControlName="emailAuth" 
      type="email"
      autocomplete="email"
      class="mt-2 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all"
      [class.border-red-500]="hasFieldError('emailAuth')"
      [class.focus:ring-red-500]="hasFieldError('emailAuth')"
      [class.border-green-500]="isFieldValid('emailAuth')"
    />
    @if (getFieldError('emailAuth')) {
      <div class="mt-1 text-sm text-red-600">
        {{ getFieldError('emailAuth') }}
      </div>
    }
  </div>

  <!-- Password -->
  <div>
    <label class="block text-sm font-medium leading-6 text-gray-900">Пароль</label>
    <input 
      formControlName="password" 
      type="password"
      autocomplete="current-password"
      class="mt-2 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all"
      [class.border-red-500]="hasFieldError('password')"
      [class.focus:ring-red-500]="hasFieldError('password')"
      [class.border-green-500]="isFieldValid('password')"
    />
    @if (getFieldError('password')) {
      <div class="mt-1 text-sm text-red-600">
        {{ getFieldError('password') }}
      </div>
    }
  </div>

  <button 
    type="submit" 
    [disabled]="!canSubmit()"
    class="w-full rounded-md bg-indigo-600 px-3 py-2 text-white hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors flex justify-center items-center"
  >
    @if (!disabled) {
      <span>Войти</span>
    } @else {
      <span class="flex items-center">
        <span class="inline-block w-4 h-4 mr-2 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        Вход...
      </span>
    }
  </button>
</form>
