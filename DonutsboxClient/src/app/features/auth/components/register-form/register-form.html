<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
  <!-- Email -->
  <div>
    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
    <input
      id="email"
      type="email"
      formControlName="authEmail"
      autocomplete="email"
      class="mt-1 block w-full px-3 py-2 rounded-md border border-gray-300 shadow-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all disabled:bg-gray-100 disabled:cursor-not-allowed"
      [class.border-red-500]="hasFieldError('authEmail')"
      [class.focus:ring-red-500]="hasFieldError('authEmail')"
      [class.border-green-500]="isFieldValid('authEmail')"
      [class.focus:ring-green-500]="isFieldValid('authEmail')"
    />
    @if (getFieldError('authEmail')) {
      <div class="mt-1 text-sm text-red-600 animate-fadeIn">
        {{ getFieldError('authEmail') }}
      </div>
    }
  </div>

  <!-- Password -->
  <div>
    <label for="password" class="block text-sm font-medium text-gray-700">Пароль</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="new-password"
      class="mt-1 block w-full px-3 py-2 rounded-md border border-gray-300 shadow-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all disabled:bg-gray-100 disabled:cursor-not-allowed"
      [class.border-red-500]="hasFieldError('password')"
      [class.focus:ring-red-500]="hasFieldError('password')"
      [class.border-green-500]="isFieldValid('password')"
      [class.focus:ring-green-500]="isFieldValid('password')"
    />
    @if (getFieldError('password')) {
      <div class="mt-1 text-sm text-red-600 animate-fadeIn">
        {{ getFieldError('password') }}
      </div>
    }
  </div>

  <!-- Repeat Password -->
  <div>
    <label for="repeatPassword" class="block text-sm font-medium text-gray-700">Повторите пароль</label>
    <input
      id="repeatPassword"
      type="password"
      formControlName="repeatPassword"
      autocomplete="new-password"
      class="mt-1 block w-full px-3 py-2 rounded-md border border-gray-300 shadow-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all disabled:bg-gray-100 disabled:cursor-not-allowed"
      [class.border-red-500]="hasFieldError('repeatPassword')"
      [class.focus:ring-red-500]="hasFieldError('repeatPassword')"
      [class.border-green-500]="isFieldValid('repeatPassword')"
      [class.focus:ring-green-500]="isFieldValid('repeatPassword')"
    />
    @if (getFieldError('repeatPassword')) {
      <div class="mt-1 text-sm text-red-600 animate-fadeIn">
        {{ getFieldError('repeatPassword') }}
      </div>
    }
  </div>

  <!-- Role -->
  <div>
    <label for="role" class="block text-sm font-medium text-gray-700">Роль</label>
    <select
      id="role"
      formControlName="role"
      class="mt-1 block w-full px-3 py-2 rounded-md border border-gray-300 shadow-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all disabled:bg-gray-100 disabled:cursor-not-allowed"
    >
      <option value="User">Пользователь</option>
      <option value="Creator">Автор</option>
    </select>
  </div>

  <button
    type="submit"
    [disabled]="registerForm.invalid || disabled"
    class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
  >
    @if (!disabled) {
      <span>Зарегистрироваться</span>
    } @else {
      <span class="flex items-center">
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Регистрация...
      </span>
    }
  </button>
</form>
