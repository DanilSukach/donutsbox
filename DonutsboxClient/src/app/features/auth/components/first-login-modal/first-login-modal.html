<div class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Добро пожаловать!</h2>
      <button type="button" class="close-btn" (click)="close()" [disabled]="isLoading()" title="Закрыть (можно заполнить позже)">×</button>
    </div>

    <div class="modal-body">
      <p class="welcome-text">Пожалуйста, заполните ваши данные для завершения регистрации</p>

      <form [formGroup]="firstLoginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name" class="form-label">
            Имя пользователя <span class="required">*</span>
          </label>
          <input
            type="text"
            id="name"
            formControlName="name"
            class="form-input"
            [class.error]="hasFieldError('name')"
            placeholder="Введите ваше имя"
            [disabled]="isLoading()"
          />
          @if (hasFieldError('name')) {
            <span class="error-message">{{ getFieldError('name') }}</span>
          }
        </div>

        <div class="form-group">
          <label for="phoneNumber" class="form-label">
            Номер телефона
          </label>
          <input
            type="tel"
            id="phoneNumber"
            formControlName="phoneNumber"
            class="form-input"
            [class.error]="hasFieldError('phoneNumber')"
            placeholder="Введите номер телефона (необязательно)"
            maxlength="11"
            [disabled]="isLoading()"
          />
          @if (hasFieldError('phoneNumber')) {
            <span class="error-message">{{ getFieldError('phoneNumber') }}</span>
          }
        </div>

        @if (error()) {
          <div class="server-error">
            {{ error() }}
          </div>
        }

        <div class="modal-footer">
          <button
            type="submit"
            class="submit-btn"
            [disabled]="firstLoginForm.invalid || isLoading()"
          >
            @if (isLoading()) {
              <span>Сохранение...</span>
            } @else {
              <span>Продолжить</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
