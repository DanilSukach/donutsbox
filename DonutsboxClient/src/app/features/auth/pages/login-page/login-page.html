<div class="min-h-screen bg-gradient-to-br from-pink-50 via-yellow-50 to-amber-50 flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div class="text-center">
      <div class="flex justify-center mb-6">
        <div class="w-12 h-12 bg-gradient-to-br from-amber-400 to-amber-600 rounded-full flex items-center justify-center">
          <span class="text-white font-bold text-lg">🔐</span>
        </div>
      </div>
      <h2 class="text-3xl font-extrabold text-amber-900 tracking-tight">
        Вход в аккаунт
      </h2>
      <p class="mt-2 text-amber-800">
        Войдите, чтобы получить доступ к вашей ленте
      </p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <app-login-form 
        (login)="onLogin($event)"
        [disabled]="isLoading"
        [serverError]="serverError">
      </app-login-form>

      <div class="mt-8 text-center">
        <p class="text-sm text-gray-600">
          Нет аккаунта?
          <a routerLink="/auth/register" class="font-semibold text-amber-600 hover:text-amber-700 transition-colors">
            Зарегистрируйтесь
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
