 <div class="space-y-6">
      @if (isLoading()) {
        <div class="text-center py-12">
          <div class="animate-spin text-4xl mb-4">⏳</div>
          <p class="text-gray-600">Загрузка постов...</p>
        </div>
      } @else if (posts().length === 0) {
        <div class="text-center py-12 bg-white rounded-xl border-2 border-dashed border-gray-300">
          <span class="text-6xl mb-4 block">📭</span>
          <p class="text-gray-600 text-lg">Постов пока нет</p>
        </div>
      } @else {
        @for (post of posts(); track post.id) {
          <app-post-card [post]="post"></app-post-card>
        }
      }

      <!-- Pagination -->
      @if (totalPages() > 1) {
        <div class="flex justify-center gap-2 mt-8">
          <button 
            (click)="previousPage()"
            [disabled]="currentPage() === 1"
            class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            ← Назад
          </button>
          <span class="px-4 py-2 bg-amber-100 text-amber-900 rounded-lg font-semibold">
            {{ currentPage() }} / {{ totalPages() }}
          </span>
          <button 
            (click)="nextPage()"
            [disabled]="currentPage() === totalPages()"
            class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Далее →
          </button>
        </div>
      }
    </div>
