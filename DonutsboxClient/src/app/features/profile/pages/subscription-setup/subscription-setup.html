<div class="min-h-screen bg-gradient-to-br from-pink-50 via-yellow-50 to-amber-50 flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="max-w-lg w-full space-y-8">
    <!-- Header -->
    <div class="text-center">
      <div class="flex justify-center mb-6">
        <div class="w-12 h-12 bg-gradient-to-br from-amber-400 to-amber-600 rounded-full flex items-center justify-center">
          <span class="text-white font-bold text-lg">💎</span>
        </div>
      </div>
      <h1 class="text-3xl font-extrabold text-amber-900 tracking-tight">Создание подписки</h1>
      <p class="mt-2 text-amber-800">
        Создайте свой первый тариф подписки для монетизации контента
      </p>
    </div>

    <!-- Form Container -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <app-subscription-form
        [showSkip]="true"
        [isSubmitting]="isCreating()"
        [errorMessage]="errorMessage()"
        submitLabel="Создать подписку"
        skipLabel="Пропустить"
        (submitted)="onSubmit($event)"
        (skipped)="skipSubscription()"
      ></app-subscription-form>
    </div>
  </div>
</div>
