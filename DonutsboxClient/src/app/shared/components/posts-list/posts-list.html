 <div class="space-y-6">
      @if (isLoading()) {
        <div class="text-center py-12">
          <div class="animate-spin text-4xl mb-4">⏳</div>
          <p class="text-gray-600">Загрузка постов...</p>
        </div>
      } @else if (posts().length === 0) {
        <div class="text-center py-12 bg-white rounded-xl border-2 border-dashed border-gray-300">
          <span class="text-6xl mb-4 block">📭</span>
          <p class="text-gray-600 text-lg">Постов пока нет</p>
        </div>
      } @else {
        @for (post of posts(); track post.id) {
          <app-post-card [post]="post" [isOwner]="isPostOwner()"></app-post-card>
        }
      }
    </div>
