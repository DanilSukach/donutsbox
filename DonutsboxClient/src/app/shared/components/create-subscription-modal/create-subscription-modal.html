<div class="create-subscription-modal bg-white rounded-2xl shadow-2xl border border-gray-200">
  <div class="modal-header flex items-start justify-between mb-6">
    <div>
      <p class="text-sm uppercase tracking-wide text-amber-500 font-semibold">Тарифы</p>
      <h2 class="text-2xl font-bold text-gray-900 mt-1">Новая подписка для подписчиков</h2>
      <p class="text-gray-600 mt-1">
        Настройте стоимость и описание, чтобы привлечь новых поддерживающих пользователей.
      </p>
    </div>
    <button
      type="button"
      (click)="onClose()"
      class="close-button text-gray-500 hover:text-gray-900 transition-colors text-2xl leading-none"
      aria-label="Закрыть"
    >
      &times;
    </button>
  </div>

  <app-subscription-form
    [isSubmitting]="isCreating()"
    [errorMessage]="errorMessage()"
    [showSkip]="false"
    submitLabel="Создать подписку"
    (submitted)="onSubmit($event)"
  ></app-subscription-form>
</div>
