<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <!-- Modal Content -->
  <div class="bg-white rounded-xl shadow-2xl max-w-md w-full" (click)="onModalContentClick($event)">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center">
          <span class="text-2xl">📧</span>
        </div>
        <h2 class="text-xl font-bold text-gray-900">Смена Email</h2>
      </div>
      <button
        type="button"
        (click)="onClose($event)"
        class="text-gray-400 hover:text-gray-600 transition-colors"
        title="Закрыть"
      >
        <span class="text-2xl">×</span>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-4">
      <!-- New Email -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Новый Email <span class="text-red-500">*</span>
        </label>
        <input
          type="email"
          [(ngModel)]="newEmailValue"
          class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
          placeholder="example@email.com"
          [disabled]="isSubmitting()"
        />
      </div>

      <!-- Error Message -->
      @if (error()) {
        <div class="p-4 bg-red-50 border border-red-200 rounded-lg text-red-800 text-sm">
          {{ error() }}
        </div>
      }

      <!-- Actions -->
      <div class="flex gap-3 pt-4">
        <button
          type="button"
          (click)="onClose($event)"
          class="flex-1 px-4 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors font-semibold"
          [disabled]="isSubmitting()"
        >
          Отмена
        </button>
        <button
          type="button"
          (click)="onButtonClick()"
          class="flex-1 px-4 py-3 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition-colors font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="isSubmitting()"
        >
          @if (isSubmitting()) {
            <span class="flex items-center justify-center gap-2">
              <span class="animate-spin">⏳</span>
              <span>Сохранение...</span>
            </span>
          } @else {
            <span>Сменить Email</span>
          }
        </button>
      </div>
    </div>
  </div>
</div>
